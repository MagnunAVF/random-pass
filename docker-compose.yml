version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: random-pass-redis
    profiles:
      - dev
      - test
      - prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: random-pass-postgres
    profiles:
      - dev
      - test
      - prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: randompass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: random-pass-app
    profiles:
      - prod
    ports:
      - "3000:3000"
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/randompass?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
